<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="same-origin">
<title>Administration | Plan B Careers</title>
<meta name="description" content="Private Plan B Careers administration for applications and admission enquiries.">
<link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/white-theme.css">
<link rel="icon" href="/images/optimized/planb-logo.webp"><script src="/js/admin.js" defer></script>
</head>
<body>
<a href="#admin-main" class="skip-link">Skip to administration</a>
<header class="site-header"><div class="page-shell header-row"><a href="/" class="brand"><span>Plan B Careers<small>Administration</small></span></a><div class="flex flex-wrap gap-3 items-center"><a href="/" class="button button-outline">View website</a><button type="button" id="logout-button" class="button button-outline" hidden>Sign out</button></div></div></header>
<main id="admin-main" class="page-shell py-10">
<h1 class="text-3xl font-bold text-navy-900 mb-4">Applications and enquiries</h1>
<p id="session-status" class="notice" role="status" aria-live="polite">Checking your session…</p>
<noscript><p class="notice notice-error">JavaScript is required to sign in and manage records.</p></noscript>
<section id="login-panel" class="form-panel mt-6" aria-labelledby="login-heading" hidden>
<h2 id="login-heading" class="text-2xl font-bold mb-3">Sign in</h2><p class="mb-5">Use your administrator account. Access depends on the server's account and storage configuration.</p>
<form id="login-form">
<div class="field"><label for="admin-username">Username</label><input id="admin-username" name="username" autocomplete="username" maxlength="100" required></div>
<div class="field"><label for="admin-password">Password</label><input id="admin-password" name="password" type="password" autocomplete="current-password" maxlength="200" required></div>
<button class="button" type="submit" id="login-button">Sign in</button>
<p id="login-error" class="notice notice-error" role="alert" hidden></p>
</form></section>
<section id="workspace" class="mt-6" hidden aria-label="Administration workspace">
<nav aria-label="Administration sections" class="flex flex-wrap gap-3 mb-6">
<button type="button" class="button" data-view="applications" aria-pressed="true">Applications</button>
<button type="button" class="button button-outline" data-view="admissions" aria-pressed="false">Admission enquiries</button>
<button type="button" class="button button-outline" data-view="jobs" aria-pressed="false">Published jobs</button>
</nav>
<div class="flex flex-wrap gap-4 items-center justify-between mb-4"><h2 id="view-heading" class="text-2xl font-bold text-navy-900">Applications</h2><button type="button" id="refresh-button" class="button button-outline">Refresh records</button></div>
<p id="view-description" class="mb-5"></p>
<div class="form-grid"><div class="field"><label for="record-search">Search loaded records</label><input id="record-search" type="search" placeholder="Name, contact, city or role" autocomplete="off"></div><div class="field"><label for="record-filter">Status</label><select id="record-filter"><option value="">All statuses</option></select></div></div>
<p id="records-status" class="notice" role="status" aria-live="polite"></p>
<div id="records-region" class="table-scroll" aria-busy="false"><table class="content-table"><caption id="records-caption" class="text-left font-semibold py-3">Loaded applications</caption><thead id="records-head"></thead><tbody id="records-body"></tbody></table></div>
<section id="record-editor" class="form-panel mt-8" aria-labelledby="editor-heading" hidden>
<div class="flex flex-wrap justify-between gap-3 items-center mb-5"><h2 id="editor-heading" class="text-2xl font-bold" tabindex="-1">Review record</h2><button type="button" id="close-editor" class="button button-outline">Close record</button></div>
<dl id="record-details" class="space-y-3 mb-6"></dl>
<p id="resume-area" class="mb-6" hidden><button type="button" id="resume-button" class="button button-outline">Download private resume</button></p>
<form id="record-form"><div class="field"><label for="record-status">Status</label><select id="record-status" required></select></div><div class="field"><label for="record-notes">Internal notes</label><textarea id="record-notes" rows="5" maxlength="4000"></textarea></div><div class="flex flex-wrap gap-3"><button type="submit" id="save-button" class="button">Save changes</button><button type="button" id="delete-button" class="button button-outline" hidden>Delete enquiry</button></div><p id="editor-message" class="notice" role="status" aria-live="polite" hidden></p></form>
</section>
</section>
</main>
</body></html>
