<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2E6B"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4A017"/>
      <stop offset="100%" style="stop-color:#F4C430"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="300" cy="250" r="160"/></clipPath>
  </defs>

  <rect width="600" height="700" rx="20" fill="url(#bg)"/>
  <rect x="0" y="0" width="600" height="5" fill="url(#gold)"/>

  <!-- Avatar circle -->
  <circle cx="300" cy="250" r="165" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="300" cy="250" r="160" fill="url(#avatarGrad)"/>
  <text x="300" y="290" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="96" font-weight="900" fill="rgba(255,255,255,0.9)">A</text>

  <!-- Camera icon overlay -->
  <rect x="220" y="375" width="160" height="44" rx="22" fill="rgba(0,0,0,0.5)"/>
  <text x="300" y="404" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">📷 Upload Photo</text>

  <!-- Name + Role -->
  <text x="300" y="470" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">Asnan</text>
  <rect x="230" y="480" width="140" height="2" rx="1" fill="url(#gold)"/>
  <text x="300" y="510" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#93C5FD">Founder & Director</text>
  <text x="300" y="536" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B">Plan B Consultancy — Akola, Maharashtra</text>

  <!-- Upload box -->
  <rect x="80" y="568" width="440" height="60" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="300" y="598" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">Replace: team-founder-asnan.svg  (JPG / PNG / WEBP)</text>
  <text x="300" y="618" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#334155">Recommended size: 600 × 700 px</text>

  <!-- Filename -->
  <text x="300" y="685" text-anchor="middle" font-family="monospace" font-size="10" fill="#1E293B">assets/images/team/team-founder-asnan.svg — PLACEHOLDER</text>
</svg>
