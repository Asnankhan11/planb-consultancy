<svg xmlns="http://www.w3.org/2000/svg" width="400" height="700" viewBox="0 0 400 700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="700" rx="16" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="0" y="0" width="400" height="5" rx="3" fill="url(#accent)"/>

  <!-- Phone frame top bar -->
  <rect x="20" y="25" width="360" height="650" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Camera notch -->
  <rect x="160" y="35" width="80" height="10" rx="5" fill="rgba(255,255,255,0.1)"/>

  <!-- Status bar dots -->
  <circle cx="60" cy="60" r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="340" cy="60" r="4" fill="rgba(255,255,255,0.2)"/>

  <!-- Centre content -->
  <text x="200" y="330" text-anchor="middle" font-size="64" font-family="Arial">💳</text>
  <text x="200" y="395" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Payment Proof</text>
  <text x="200" y="425" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B">UPI / Bank Transfer Screenshot</text>

  <!-- Dashed upload zone -->
  <rect x="60" y="455" width="280" height="60" rx="10" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="200" y="490" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">Upload screenshot (JPG/PNG)</text>

  <!-- Filename hint -->
  <text x="200" y="670" text-anchor="middle" font-family="monospace" font-size="10" fill="#334155" opacity="0.8">payment-proof-01.svg</text>
</svg>
