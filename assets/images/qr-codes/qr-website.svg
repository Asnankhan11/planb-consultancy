<svg xmlns="http://www.w3.org/2000/svg" width="400" height="480" viewBox="0 0 400 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="400" height="480" rx="20" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="0" y="0" width="400" height="4" rx="2" fill="#8B5CF6"/>

  <!-- QR placeholder square with finder pattern simulation -->
  <rect x="80" y="40" width="240" height="240" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Finder patterns (top-left) -->
  <rect x="98" y="58" width="50" height="50" rx="4" fill="rgba(255,255,255,0.12)"/>
  <rect x="103" y="63" width="40" height="40" rx="3" fill="rgba(255,255,255,0.05)"/>
  <rect x="109" y="69" width="28" height="28" rx="2" fill="rgba(255,255,255,0.15)"/>

  <!-- Finder patterns (top-right) -->
  <rect x="252" y="58" width="50" height="50" rx="4" fill="rgba(255,255,255,0.12)"/>
  <rect x="257" y="63" width="40" height="40" rx="3" fill="rgba(255,255,255,0.05)"/>
  <rect x="263" y="69" width="28" height="28" rx="2" fill="rgba(255,255,255,0.15)"/>

  <!-- Finder patterns (bottom-left) -->
  <rect x="98" y="212" width="50" height="50" rx="4" fill="rgba(255,255,255,0.12)"/>
  <rect x="103" y="217" width="40" height="40" rx="3" fill="rgba(255,255,255,0.05)"/>
  <rect x="109" y="223" width="28" height="28" rx="2" fill="rgba(255,255,255,0.15)"/>

  <!-- Centre logo circle -->
  <circle cx="200" cy="160" r="32" fill="#0F172A" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="200" y="172" text-anchor="middle" font-size="28" font-family="Arial">🌐</text>

  <!-- Label -->
  <text x="200" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Website</text>

  <!-- URL hint -->
  <rect x="40" y="350" width="320" height="36" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="200" y="373" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748B">planb-consultancy.in</text>

  <!-- Upload instruction -->
  <text x="200" y="420" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">Upload real QR: qr-website.svg</text>
  <text x="200" y="440" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">(JPG / PNG / SVG — same filename)</text>

  <!-- Filename -->
  <text x="200" y="468" text-anchor="middle" font-family="monospace" font-size="9" fill="#1E293B">assets/images/qr-codes/qr-website.svg</text>
</svg>
